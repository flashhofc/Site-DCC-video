<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala Tática - DCC</title>
    <!-- Favicon: O brasão dos Bombeiros -->
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        /* Estilos Gerais */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Barra superior com o logo */
        #header { background-color: #1e1e1e; border-bottom: 2px solid #ff3b3b; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
        #header img { height: 50px; width: auto; margin-right: 15px; }
        #header-title { font-size: 20px; font-weight: bold; text-transform: uppercase; color: #ff3b3b; letter-spacing: 2px; }

        /* Container Principal (Video + Lista de Usuários) */
        #main-container { display: flex; flex: 1; overflow: hidden; }

        /* Lado Esquerdo: Vídeo e Controles */
        #video-section { flex: 2; background-color: #000; display: flex; flex-direction: column; justify-content: flex-start; position: relative; }
        
        /* Wrapper do Iframe */
        #video-wrapper { position: relative; width: 100%; height: 0; padding-bottom: 56.25%; /* Proporção 16:9 */ }
        #youtubePlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* Painel de Controles (Visível apenas para Moderador) */
        #controls-panel { background-color: #2c2c2c; padding: 10px; display: none; gap: 10px; align-items: center; border-top: 1px solid #444; }
        input[type="text"] { flex: 1; padding: 8px; border: 1px solid #555; background-color: #1e1e1e; color: #e0e0e0; border-radius: 4px; }
        button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-weight: bold; transition: background 0.2s; }
        .btn-play { background-color: #4CAF50; color: white; }
        .btn-play:hover { background-color: #388E3C; }
        .btn-pause { background-color: #FF9800; color: white; }
        .btn-pause:hover { background-color: #F57C00; }
        .btn-change { background-color: #2196F3; color: white; }
        .btn-change:hover { background-color: #0D47A1; }
        .btn-arcade { background-color: #9c27b0; color: white; width: 100%; margin-top: 10px; padding: 10px; }
        .btn-arcade:hover { background-color: #7b1fa2; }

        /* Lado Direito: Chat e Lista de Operadores */
        #sidebar { flex: 1; background-color: #1e1e1e; border-left: 1px solid #333; display: flex; flex-direction: column; }
        
        /* Tabs de Navegação */
        #tabs { display: flex; border-bottom: 1px solid #333; }
        .tab-btn { flex: 1; padding: 15px; background: #2c2c2c; color: #aaa; cursor: pointer; border: none; border-bottom: 2px solid transparent; font-weight: bold; }
        .tab-btn.active { background-color: #1e1e1e; color: #ff3b3b; border-bottom-color: #ff3b3b; }

        /* Conteúdo das Abas */
        .tab-content { flex: 1; display: none; padding: 15px; overflow-y: auto; }
        .tab-content.active { display: flex; flex-direction: column; }

        /* Área de Chat */
        #chat-messages { flex: 1; display: flex; flex-direction: column-reverse; gap: 10px; overflow-y: auto; margin-bottom: 10px; }
        .chat-msg { background: #2c2c2c; padding: 8px; border-radius: 4px; font-size: 0.9rem; }
        .chat-msg strong { color: #ff3b3b; }
        
        #chat-input-area { display: flex; gap: 5px; }

        /* Lista de Operadores */
        #users-list { list-style: none; padding: 0; margin: 0; gap: 5px; }
        .user-item { background: #2c2c2c; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .user-status { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-online { background-color: #4CAF50; }
        
        /* Modal de Login */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: #2c2c2c; padding: 30px; border-radius: 8px; text-align: center; border: 1px solid #444; max-width: 400px; width: 90%; }
        .modal h3 { color: #ff3b3b; text-transform: uppercase; margin-bottom: 15px; }
        .hidden { display: none !important; }
        
        .btn-tatico { background-color: #ff3b3b; color: white; border: none; padding: 12px 24px; border-radius: 4px; font-weight: bold; text-transform: uppercase; cursor: pointer; width: 100%; margin-top: 20px; transition: all 0.3s; }
        .btn-tatico:hover { background-color: #cc2f2f; box-shadow: 0 0 15px rgba(255, 59, 59, 0.5); }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header id="header">
        <div style="display: flex; align-items: center;">
            <img src="logo.png" alt="Logo DCC Bombeiros">
            <span id="header-title">Sala Tática DCC - Sistema Operacional</span>
        </div>
        <span id="room-id-display" style="color: #aaa; font-size: 0.8rem;">Sala: Carregando...</span>
    </header>

    <!-- Container Principal -->
    <div id="main-container">
        
        <!-- Seção do Vídeo -->
        <section id="video-section">
            <div id="video-wrapper">
                <iframe id="youtubePlayer" 
                    src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1&autoplay=1" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" 
                    allowfullscreen>
                </iframe>
            </div>
            
            <!-- Painel do Moderador -->
            <div id="controls-panel">
                <input type="text" id="videoUrlInput" placeholder="Link do YouTube...">
                <button class="btn-change" onclick="mudarVideo()">Trocar Vídeo</button>
                <button class="btn-play" onclick="enviarComando('play-video')">▶ Play</button>
                <button class="btn-pause" onclick="enviarComando('pause-video')">⏸ Pause</button>
            </div>
        </section>

        <!-- Sidebar -->
        <aside id="sidebar">
            <div id="tabs">
                <button class="tab-btn active" onclick="trocarAba('chat')">Chat Tático</button>
                <button class="tab-btn" onclick="trocarAba('users')">Operadores</button>
            </div>

            <!-- Aba Chat -->
            <div id="chat-tab" class="tab-content active">
                <div id="chat-messages"></div>
                <!-- Botão Fliperama integrado aqui na aba de chat -->
                <button class="btn-arcade" onclick="abrirFliperama()">🎮 Fliperama / Jogos</button>
                <div id="chat-input-area" style="margin-top: 10px;">
                    <input type="text" id="chatMessageInput" placeholder="Digite sua mensagem...">
                    <button class="btn-change" onclick="enviarMensagem()">Enviar</button>
                </div>
            </div>

            <!-- Aba Usuários -->
            <div id="users-tab" class="tab-content">
                <ul id="users-list">
                    <li class="user-item"><span>Carregando lista...</span></li>
                </ul>
            </div>
        </aside>
    </div>

    <!-- Modal de Identificação -->
    <div id="visitorModal" class="modal">
        <div class="modal-content">
            <h3>Identificação de Operador</h3>
            <p>Insira suas credenciais para acessar a sala tática.</p>
            <input type="text" id="vName" placeholder="Seu Nome / Patente" autocomplete="off">
            <input type="text" id="vId" placeholder="Seu ID FiveM" autocomplete="off">
            <button type="button" onclick="entrarComoVisitante()" class="btn-tatico">Autenticar Acesso</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let socket;
        let player;
        let roomId = new URLSearchParams(window.location.search).get('room') || 'geral';
        let isMod = new URLSearchParams(window.location.search).get('mod') === 'true';
        let myName = '';
        let myId = '';

        window.onload = function() {
            document.getElementById('room-id-display').innerText = `Sala: ${roomId}`;
            if(isMod) {
                document.getElementById('controls-panel').style.display = 'flex';
            }
            conectarSocket();
        };

        function conectarSocket() {
            socket = io();

            socket.on('action-play', () => {
                if (player && player.playVideo) player.playVideo();
            });

            socket.on('action-pause', () => {
                if (player && player.pauseVideo) player.pauseVideo();
            });

            socket.on('sync-video', (data) => {
                const videoId = extrairIdYouTube(data.videoUrl);
                if(player && player.loadVideoById) {
                    player.loadVideoById(videoId);
                }
            });

            socket.on('new-chat-message', (data) => {
                adicionarMensagemAoChat(data.name, data.message);
            });

            socket.on('room-user-list', (users) => {
                atualizarListaUsuarios(users);
            });
        }

        function entrarComoVisitante() {
            const nameEl = document.getElementById('vName');
            const idEl = document.getElementById('vId');
            
            myName = nameEl.value.trim();
            myId = idEl.value.trim();
            
            if(!myName || !myId) {
                alert('Por favor, preencha seu nome e ID FiveM!');
                return;
            }
            
            document.getElementById('visitorModal').classList.add('hidden');
            socket.emit('join-room', { roomId, isMod, name: myName, fivemId: myId });
        }

        function onYouTubeIframeAPIReady() {
            const initialVideoId = extrairIdYouTube(document.getElementById('youtubePlayer').src);
            player = new YT.Player('youtubePlayer', {
                videoId: initialVideoId,
                playerVars: { 'autoplay': 1, 'controls': 1, 'enablejsapi': 1, 'fs': 1 }
            });
        }

        function extrairIdYouTube(url) {
            var match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length == 11) ? match[2] : 'dQw4w9WgXcQ';
        }

        function trocarAba(aba) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if(aba === 'chat') {
                document.querySelector('button[onclick="trocarAba(\'chat\')"]').classList.add('active');
                document.getElementById('chat-tab').classList.add('active');
            } else {
                document.querySelector('button[onclick="trocarAba(\'users\')"]').classList.add('active');
                document.getElementById('users-tab').classList.add('active');
            }
        }

        function enviarMensagem() {
            const input = document.getElementById('chatMessageInput');
            const mensagem = input.value.trim();
            if(!mensagem) return;

            socket.emit('send-chat-message', { roomId, name: myName, message: mensagem });
            input.value = '';
        }

        function adicionarMensagemAoChat(nome, mensagem) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<strong>${nome}:</strong> ${mensagem}`;
            container.prepend(div);
        }

        function atualizarListaUsuarios(users) {
            const lista = document.getElementById('users-list');
            lista.innerHTML = '';
            users.forEach(user => {
                const li = document.createElement('li');
                li.className = 'user-item';
                li.innerHTML = `<span><span class="user-status status-online"></span>${user.name} (ID: ${user.fivemId})</span>`;
                lista.appendChild(li);
            });
        }

        function enviarComando(acao) {
            socket.emit(acao, roomId);
        }

        function mudarVideo() {
            const urlInput = document.getElementById('videoUrlInput').value.trim();
            if(!urlInput) {
                alert('Cole o link do YouTube!');
                return;
            }
            socket.emit('change-video', { roomId, newVideoUrl: urlInput });
        }

        // Função do Botão Fliperama (Abre a central de jogos)
        function abrirFliperama() {
            window.open('fliperama.html', '_blank'); // Altere para o arquivo de jogos se o nome for diferente (ex: snake.html)
        }
    </script>
</body>
</html>
