<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>D.C.C - Treinamento Ativo</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body class="bg-room">
    
    <!-- Modal do Recruta -->
    <div id="visitorModal" class="modal hidden">
        <div class="glass-container tactical-border" style="max-width: 450px;">
            <img src="dcc2.png" alt="DCC" style="width: 120px; border-radius: 5px; margin-bottom: 15px; border: 2px solid #ff3b3b;">
            <h2 class="cyber-text">IDENTIFICAÇÃO DE RECRUTA</h2>
            <input type="text" id="vName" placeholder="Seu Nome">
            <input type="text" id="vId" placeholder="Passaporte (ID) do FiveM">
            <button onclick="entrarComoVisitante()" class="btn-red glow">APRESENTAR-SE</button>
        </div>
    </div>

    <!-- Modal do Minigame (Fliperama ARCADE PRO) -->
    <div id="gameModal" class="modal hidden">
        <div class="glass-container tactical-border" style="max-width: 580px;">
            <h2 class="cyber-text">🕹️ TERMINAL ARCADE D.C.C</h2>
            
            <div id="gameMenu" style="display: flex; gap: 8px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap;">
                <button onclick="iniciarSnake()" class="btn-green glow" style="width: auto; padding: 10px;">🐍 CYBER SNAKE</button>
                <button onclick="iniciarPong()" class="btn-blue glow" style="width: auto; padding: 10px;">🏓 NEON PONG</button>
                <button onclick="iniciarTiro()" class="btn-red glow" style="width: auto; padding: 10px;">🎯 DEFESA AÉREA</button>
                <button onclick="iniciarFlappy()" class="btn-orange glow" style="width: auto; padding: 10px;">🚁 RESGATE</button>
            </div>

            <canvas id="gameCanvas" width="500" height="400" style="background: #0a0a0a; border: 2px solid #ff3b3b; margin: 0 auto; display: block; box-shadow: inset 0 0 30px #000, 0 0 15px #ff0000;"></canvas>
            
            <p id="gameInstructions" style="color: #00ff00; margin-top: 15px; font-weight: bold; font-size: 15px;">Selecione uma simulação acima.</p>
            <p id="scoreBoard" style="color: white; margin-top: 5px; font-size: 20px; font-weight: 900;">Aguardando sistema...</p>
            
            <button onclick="fecharMinigame()" class="btn-red glow" style="margin-top: 15px;">FECHAR TERMINAL</button>
        </div>
    </div>

    <div class="room-layout">
        <!-- SEÇÃO DO VÍDEO -->
        <div class="video-section glass-container tactical-border">
            <div id="blocker" class="blocker hidden"></div> 
            <div class="video-frame"><div id="player"></div></div>
            <button id="btnFullscreen" onclick="abrirTelaCheia()" class="btn-blue hidden glow" style="margin-top: 15px;">📺 MODO IMERSÃO</button>
            
            <!-- PAINEL DO MODERADOR -->
            <div id="modControls" class="hidden">
                <div class="controls-row" style="margin-top: 20px;">
                    <button onclick="playVideo()" class="btn-green glow">▶ INICIAR MATERIAL</button>
                    <button onclick="pauseVideo()" class="btn-red glow">⏸ INTERROMPER</button>
                    <button onclick="abrirMinigame()" class="btn-orange glow" style="background: #4a148c; border-color: #aa00ff; box-shadow: 0 0 15px #aa00ff;">🕹️ FLIPERAMA</button>
                </div>
                
                <div class="link-box tactical-panel">
                    <span>📡 COMUNICAÇÃO:</span>
                    <input type="text" id="linkCopy" readonly>
                    <button onclick="copiarLink()" class="btn-orange">📋 COPIAR LINK</button>
                </div>

                <div class="controls-row" style="margin-top: 15px;">
                    <input type="text" id="newVid" placeholder="Inserir nova diretriz (Link Youtube)">
                    <button onclick="changeVideo()" class="btn-blue glow">🔄 SUBSTITUIR</button>
                </div>
            </div>
        </div>

        <!-- LATERAL -->
        <div class="sidebar glass-container tactical-border hidden" id="modSidebar">
            <h3 class="cyber-text">⚡ MONITORAMENTO TÁTICO</h3>
            <ul id="userList"></ul>
        </div>
    </div>

    <script>
        // ==========================================
        //  SOCKET E YOUTUBE BLINDADOS (ZERO TELA CINZA)
        // ==========================================
        let socket;
        let player = null;
        let urlAtual = '';
        let roomId = '';
        let isMod = false;

        window.addEventListener('DOMContentLoaded', () => {
            try {
                socket = io();
                const urlParams = new URLSearchParams(window.location.search);
                roomId = urlParams.get('room'); 
                isMod = urlParams.get('mod') === 'true';

                if (isMod) {
                    const linkInput = document.getElementById('linkCopy');
                    if(linkInput) linkInput.value = `${window.location.origin}/room.html?room=${roomId}`;
                    
                    const modControls = document.getElementById('modControls');
                    const modSidebar = document.getElementById('modSidebar');
                    if(modControls) modControls.classList.remove('hidden');
                    if(modSidebar) modSidebar.classList.remove('hidden');
                    
                    socket.emit('join-room', { roomId, isMod: true, name: 'Instrutor', fivemId: 'Admin' });
                } else {
                    const visitorModal = document.getElementById('visitorModal');
                    const blocker = document.getElementById('blocker');
                    const btnFullscreen = document.getElementById('btnFullscreen');
                    
                    if(visitorModal) visitorModal.classList.remove('hidden');
                    if(blocker) blocker.classList.remove('hidden');
                    if(btnFullscreen) btnFullscreen.classList.remove('hidden');
                }

                // Quando o moderador aperta o Play
socket.on('action-play', () => {
    console.log("Comando de Play recebido do servidor!");
    // Se estiver usando a API do IFrame do YouTube:
    if (typeof player !== 'undefined' && player.playVideo) {
        player.playVideo();
    }
});

// Quando o moderador muda o vídeo
socket.on('sync-video', (data) => {
    console.log("Sincronizando novo vídeo:", data.videoUrl);
    const iframe = document.getElementById('youtubePlayer');
    if(iframe) {
        // Extrai o ID do vídeo e atualiza o src com autoplay
        const videoId = extrairIdYouTube(data.videoUrl);
        iframe.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&autoplay=1`;
    }
});

                socket.on('action-play', () => { if(player && typeof player.playVideo === 'function') player.playVideo(); });
                socket.on('action-pause', () => { if(player && typeof player.pauseVideo === 'function') player.pauseVideo(); });

                socket.on('update-users', (users) => {
                    if(!isMod || !users) return;
                    const userList = document.getElementById('userList');
                    if(userList) {
                        userList.innerHTML = users.filter(u => !u.isMod).map(u => {
                            const statusAba = u.focused ? '<span class="status-ok">[SINAL ATIVO]</span>' : '<span class="status-bad">[SINAL PERDIDO - EM OUTRA ABA]</span>';
                            return `<li><b>Recruta: ${u.name} | ID: ${u.fivemId}</b><br> ${statusAba} | Vol: ${u.volume}%</li>`;
                        }).join('');
                    }
                });

            } catch (err) {
                console.error("Erro crítico na inicialização da sala:", err);
            }
        });

        function copiarLink() {
            const linkCopy = document.getElementById('linkCopy');
            if(linkCopy) {
                linkCopy.select(); 
                document.execCommand("copy");
                alert("Sinal copiado! Transmita aos recrutas.");
            }
        }

        function entrarComoVisitante() {
            const nameEl = document.getElementById('vName');
            const idEl = document.getElementById('vId');
            if(!nameEl || !idEl) return;
            
            const name = nameEl.value; const fivemId = idEl.value;
            if(!name || !fivemId) return alert('Apresentação incompleta!');
            
            const visitorModal = document.getElementById('visitorModal');
            if(visitorModal) visitorModal.classList.add('hidden');
            
            if(socket) socket.emit('join-room', { roomId, isMod: false, name, fivemId });
            iniciarMonitoramento();
        }

        function abrirTelaCheia() {
            const videoSec = document.querySelector('.video-section');
            if (videoSec && !document.fullscreenElement) videoSec.requestFullscreen().catch(err => {});
            else if(document.exitFullscreen) document.exitFullscreen();
        }

        function onYouTubeIframeAPIReady() {
            try {
                player = new YT.Player('player', {
                    height: '600', width: '100%', videoId: '',
                    playerVars: { 'controls': isMod ? 1 : 0, 'disablekb': 1, 'rel': 0 },
                    events: { 
                        'onReady': () => { 
                            if(player && typeof player.setVolume === 'function') player.setVolume(100); 
                            if(urlAtual && player && typeof player.cueVideoById === 'function') player.cueVideoById(urlAtual); 
                        } 
                    }
                });
            } catch(e) {
                console.error("Erro ao instanciar player do YouTube:", e);
            }
        }
        <iframe id="youtubePlayer" 
    src="https://www.youtube.com/embed/VIDEO_ID?enablejsapi=1&autoplay=1" 
    width="100%" 
    height="100%" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" 
    allowfullscreen>
</iframe>

        function playVideo() { if(socket) socket.emit('play-video', roomId); }
        function pauseVideo() { if(socket) socket.emit('pause-video', roomId); }
        function changeVideo() {
            const newVidInput = document.getElementById('newVid');
            if(!newVidInput) return;
            const url = newVidInput.value; if(!url) return;
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
            if(socket) socket.emit('change-video', { roomId, newVideoUrl: (match && match[1]) ? match[1] : url });
            newVidInput.value = '';
        }

        function iniciarMonitoramento() { 
            document.addEventListener("visibilitychange", () => enviarStatus()); 
            setInterval(() => enviarStatus(), 2000); 
        }
        
        function enviarStatus() { 
            if(socket && player && typeof player.getVolume === 'function') {
                try {
                    socket.emit('update-status', { roomId, focused: !document.hidden, volume: player.getVolume() });
                } catch(err) {}
            } 
        }

        // ==========================================
        //  MOTOR DE JOGOS ARCADE & TABULEIRO UNIFICADO
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let activeGame = ""; let animFrame;
        
        window.addEventListener("keydown", function(e) {
            if(!document.getElementById('gameModal').classList.contains('hidden') && ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) {
                e.preventDefault();
            }
        }, false);

        const keys = {}; let keysJustPressed = {};
        document.addEventListener('keydown', e => { keys[e.code] = true; keysJustPressed[e.code] = true; });
        document.addEventListener('keyup', e => { keys[e.code] = false; });

        function abrirMinigame() {
            document.getElementById('gameModal').classList.remove('hidden');
            document.getElementById('gameMenu').innerHTML = `
                <button onclick="iniciarSnake()" class="btn-green glow" style="width: auto; padding: 8px 10px;">🐍 SNAKE</button>
                <button onclick="iniciarPong()" class="btn-blue glow" style="width: auto; padding: 8px 10px;">🏓 PONG</button>
                <button onclick="iniciarTiro()" class="btn-red glow" style="width: auto; padding: 8px 10px;">🎯 DEFESA</button>
                <button onclick="iniciarFlappy()" class="btn-orange glow" style="width: auto; padding: 8px 10px;">🚁 RESGATE</button>
                <button onclick="menuVelha()" class="btn-red glow" style="width: auto; padding: 8px 10px; background: #b71c1c;">❌ VELHA</button>
                <button onclick="iniciarDama()" class="btn-blue glow" style="width: auto; padding: 8px 10px; background: #0d47a1;">♟️ DAMA</button>
            `;
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.shadowBlur = 10; ctx.shadowColor = "#00ff00";
            ctx.fillStyle = "#00ff00"; ctx.font = "20px Rajdhani"; ctx.fillText("CENTRAL TÁTICA PRONTA. ESCOLHA UM JOGO.", 45, 200);
            ctx.shadowBlur = 0;
            document.getElementById('scoreBoard').innerText = "Selecione uma categoria acima.";
        }

        function fecharMinigame() {
            document.getElementById('gameModal').classList.add('hidden');
            cancelAnimationFrame(animFrame); 
            activeGame = "";
            canvas.onclick = null; 
        }

        function gameLoop() {
            if(activeGame === "PONG") loopPong();
            else if(activeGame === "SNAKE") loopSnake();
            else if(activeGame === "TIRO") loopTiro();
            else if(activeGame === "FLAPPY") loopFlappy();
            else if(activeGame === "DAMA") loopDama();
            
            keysJustPressed = {}; 
            animFrame = requestAnimationFrame(gameLoop);
        }

        function startLoop() { 
            cancelAnimationFrame(animFrame); 
            canvas.onclick = null; 
            gameLoop(); 
        }

        // ==========================================
        //  🏓 NEON PONG (BOLA CALMA E EQUILIBRADA)
        // ==========================================
        let pong = {};
        function iniciarPong() {
            activeGame = "PONG"; 
            document.getElementById('gameInstructions').innerText = "W/S ou Setas. Colisão milimétrica ajustada!";
            pong = { pY: 160, cY: 160, bX: 250, bY: 200, sX: 2.8, sY: 1.8, pScore: 0, cScore: 0, trail: [] };
            startLoop();
        }
        function loopPong() {
            ctx.fillStyle = "rgba(10, 10, 10, 0.4)"; ctx.fillRect(0,0,canvas.width,canvas.height);
            
            if((keys["ArrowUp"] || keys["KeyW"]) && pong.pY > 0) pong.pY -= 7;
            if((keys["ArrowDown"] || keys["KeyS"]) && pong.pY < 320) pong.pY += 7;
            
            if (pong.bX > 150 && pong.sX > 0) {
                let targetY = pong.bY - 40;
                pong.cY += (targetY - pong.cY) * 0.08;
            }
            
            pong.trail.push({x: pong.bX, y: pong.bY});
            if(pong.trail.length > 8) pong.trail.shift();

            pong.bX += pong.sX; pong.bY += pong.sY;
            
            if(pong.bY <= 10) { pong.bY = 10; pong.sY *= -1; }
            if(pong.bY >= 390) { pong.bY = 390; pong.sY *= -1; }
            
            if(pong.bX <= 35 && pong.bX >= 20 && pong.bY >= pong.pY && pong.bY <= pong.pY + 80) {
                let hitPoint = (pong.bY - (pong.pY + 40)) / 40;
                let currentSpeed = Math.abs(pong.sX);
                if(currentSpeed < 6) {
                    pong.sX = (currentSpeed + 0.15) * -1; 
                } else {
                    pong.sX *= -1;
                }
                pong.sY = hitPoint * 4.5; 
                pong.bX = 36; 
            }
            
            if(pong.bX >= 465 && pong.bX <= 480 && pong.bY >= pong.cY && pong.bY <= pong.cY + 80) {
                let hitPoint = (pong.bY - (pong.cY + 40)) / 40;
                let currentSpeed = Math.abs(pong.sX);
                if(currentSpeed < 6) {
                    pong.sX = (currentSpeed + 0.15);
                } else {
                    pong.sX *= -1;
                }
                pong.sY = hitPoint * 4.5;
                pong.bX = 464; 
            }
            
            if(pong.bX < 5) { pong.cScore++; resetPong(1); }
            if(pong.bX > 495) { pong.pScore++; resetPong(-1); }

            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00b0ff"; ctx.fillStyle = "#00b0ff"; ctx.fillRect(20, pong.pY, 15, 80);
            ctx.shadowColor = "#ff3b3b"; ctx.fillStyle = "#ff3b3b"; ctx.fillRect(465, pong.cY, 15, 80);
            
            pong.trail.forEach((t, i) => {
                ctx.globalAlpha = i / pong.trail.length;
                ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(t.x, t.y, 4, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1; ctx.shadowBlur = 20; ctx.shadowColor = "#fff";
            ctx.beginPath(); ctx.arc(pong.bX, pong.bY, 7, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
            
            document.getElementById('scoreBoard').innerText = `Você: ${pong.pScore}  |  CPU: ${pong.cScore}`;
        }
        function resetPong(dir) { pong.bX = 250; pong.bY = 200; pong.sX = 2.8 * dir; pong.sY = 1.8; pong.trail = []; }

        // ==========================================
        //  🐍 CYBER SNAKE
        // ==========================================
        let snk = {}; let pulse = 0;
        function iniciarSnake() {
            activeGame = "SNAKE"; 
            document.getElementById('gameInstructions').innerText = "WASD/Setas para mover. Morreu? Aperte ESPAÇO.";
            snk = { arr: [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}], d: "R", nd: "R", score: 0, lastM: Date.now(), state: "WAIT" };
            spawnFoodSnk(); startLoop();
        }
        function spawnFoodSnk() { snk.food = { x: Math.floor(Math.random()*24), y: Math.floor(Math.random()*19) }; }
        function loopSnake() {
            ctx.fillStyle = "#050505"; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.strokeStyle = "rgba(0, 255, 0, 0.05)"; ctx.lineWidth = 1;
            for(let i=0; i<=500; i+=20) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,400); ctx.stroke(); }
            for(let i=0; i<=400; i+=20) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(500,i); ctx.stroke(); }

            if (snk.state === "WAIT" && (keys["ArrowLeft"] || keys["KeyA"] || keys["ArrowUp"] || keys["KeyW"] || keys["ArrowRight"] || keys["KeyD"] || keys["ArrowDown"] || keys["KeyS"])) snk.state = "PLAY";
            
            if (snk.state === "GAMEOVER") {
                ctx.fillStyle = "rgba(255,0,0,0.5)"; ctx.fillRect(0,0,500,400);
                ctx.shadowBlur = 10; ctx.shadowColor = "#fff"; ctx.fillStyle = "#fff"; 
                ctx.fillText("SISTEMA CORROMPIDO!", 160, 180); ctx.fillText("Pressione ESPAÇO", 175, 220); ctx.shadowBlur = 0;
                if(keys["Space"]) iniciarSnake(); return;
            }

            if((keys["ArrowLeft"] || keys["KeyA"]) && snk.d !== "R") snk.nd = "L";
            if((keys["ArrowUp"] || keys["KeyW"]) && snk.d !== "D") snk.nd = "U";
            if((keys["ArrowRight"] || keys["KeyD"]) && snk.d !== "L") snk.nd = "R";
            if((keys["ArrowDown"] || keys["KeyS"]) && snk.d !== "U") snk.nd = "D";

            if(snk.state === "PLAY" && Date.now() - snk.lastM > 85) {
                snk.lastM = Date.now(); snk.d = snk.nd;
                let h = { x: snk.arr[0].x, y: snk.arr[0].y };
                if(snk.d === "L") h.x--; if(snk.d === "R") h.x++; if(snk.d === "U") h.y--; if(snk.d === "D") h.y++;

                if(h.x < 0 || h.x >= 25 || h.y < 0 || h.y >= 20 || snk.arr.some(s => s.x === h.x && s.y === h.y)) snk.state = "GAMEOVER";
                else {
                    snk.arr.unshift(h);
                    if(h.x === snk.food.x && h.y === snk.food.y) { snk.score++; spawnFoodSnk(); } else snk.arr.pop();
                }
            }

            pulse += 0.15; let radius = 8 + Math.sin(pulse)*2;
            ctx.shadowBlur = 15; ctx.shadowColor = "#ff3b3b"; ctx.fillStyle = "#ff3b3b";
            ctx.beginPath(); ctx.arc(snk.food.x*20 + 10, snk.food.y*20 + 10, radius, 0, Math.PI*2); ctx.fill();

            ctx.shadowBlur = 10; ctx.shadowColor = "#00ff00";
            snk.arr.forEach((p, i) => {
                ctx.fillStyle = i === 0 ? "#fff" : "#00ff00"; 
                ctx.fillRect(p.x*20+1, p.y*20+1, 18, 18);
            });
            ctx.shadowBlur = 0; document.getElementById('scoreBoard').innerText = `Blocos de Dados: ${snk.score}`;
        }

        // ==========================================
        //  🎯 DEFESA AÉREA
        // ==========================================
        let tiro = {};
        function iniciarTiro() {
            activeGame = "TIRO"; 
            document.getElementById('gameInstructions').innerText = "A/D ou Setas p/ mover. Segure ESPAÇO p/ fuzilar.";
            tiro = { pX: 230, bul: [], tar: [], part: [], stars: [], sc: 0, cd: 0 };
            for(let i=0; i<50; i++) tiro.stars.push({x: Math.random()*500, y: Math.random()*400, s: Math.random()*3+1});
            startLoop();
        }
        function loopTiro() {
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,500,400);
            
            ctx.fillStyle = "#fff";
            tiro.stars.forEach(s => { s.y += s.s * 0.5; if(s.y > 400) {s.y = 0; s.x = Math.random()*500;} ctx.fillRect(s.x, s.y, s.s*0.5, s.s*0.5); });

            if((keys["ArrowLeft"] || keys["KeyA"]) && tiro.pX > 10) tiro.pX -= 7;
            if((keys["ArrowRight"] || keys["KeyD"]) && tiro.pX < 450) tiro.pX += 7;
            if(tiro.cd > 0) tiro.cd--;
            if(keys["Space"] && tiro.cd === 0) { tiro.bul.push({x: tiro.pX + 18, y: 350}); tiro.cd = 8; }

            if(Math.random() < 0.03 + (tiro.sc*0.0001)) tiro.tar.push({x: Math.random()*450, y: -30, offset: Math.random()*Math.PI*2});

            ctx.shadowBlur = 10; ctx.shadowColor = "#00ff00"; ctx.fillStyle = "#00ff00";
            for(let i = tiro.bul.length - 1; i >= 0; i--) {
                let b = tiro.bul[i]; b.y -= 15; ctx.fillRect(b.x, b.y, 4, 20);
                if(b.y < -20) tiro.bul.splice(i, 1);
            }

            ctx.shadowColor = "#ff3b3b"; ctx.fillStyle = "#ff3b3b";
            for(let i = tiro.tar.length - 1; i >= 0; i--) {
                let t = tiro.tar[i];
                t.y += 3; t.x += Math.sin(t.y*0.05 + t.offset) * 2;
                ctx.fillRect(t.x, t.y, 30, 25);
                
                if(t.y > 400) { tiro.sc -= 5; tiro.tar.splice(i, 1); continue; }

                for(let j = tiro.bul.length - 1; j >= 0; j--) {
                    let b = tiro.bul[j];
                    if(b.x > t.x - 5 && b.x < t.x + 35 && b.y < t.y + 25 && b.y > t.y - 10) {
                        tiro.sc += 10;
                        for(let p=0; p<15; p++) tiro.part.push({x: t.x+15, y: t.y+12, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, l: 20});
                        tiro.tar.splice(i, 1); tiro.bul.splice(j, 1); break;
                    }
                }
            }

            ctx.shadowBlur = 0;
            for(let i = tiro.part.length - 1; i >= 0; i--) {
                let p = tiro.part[i]; p.x += p.vx; p.y += p.vy; p.l--;
                ctx.fillStyle = `rgba(255, ${Math.random()*255}, 0, ${p.l/20})`; ctx.fillRect(p.x, p.y, 5, 5);
                if(p.l <= 0) tiro.part.splice(i, 1);
            }

            ctx.fillStyle = "#00b0ff";
            ctx.beginPath(); ctx.moveTo(tiro.pX+20, 340); ctx.lineTo(tiro.pX+40, 380); ctx.lineTo(tiro.pX, 380); ctx.fill();
            ctx.fillStyle = "#ff9800"; ctx.fillRect(tiro.pX+13, 380, 14, 8);

            document.getElementById('scoreBoard').innerText = `Ameaças Neutralizadas: ${tiro.sc}`;
        }

        // ==========================================
        //  🚁 RESGATE AÉREO
        // ==========================================
        let f = {};
        function iniciarFlappy() {
            activeGame = "FLAPPY"; 
            document.getElementById('gameInstructions').innerText = "Segure ESPAÇO ou W para subir. Solte para descer. Pressione R para reiniciar.";
            f = { y: 180, v: 0, lift: -3.2, gravity: 0.18, pipes: [], sc: 0, frame: 0, state: "PLAY" };
            startLoop();
        }

        window.addEventListener('keydown', (e) => {
            if(activeGame === "FLAPPY" && f.state === "GAMEOVER" && e.code === "KeyR") {
                iniciarFlappy(); 
            }
        });

        function loopFlappy() {
            ctx.fillStyle = "#0a192f"; ctx.fillRect(0,0,500,400);
            
            if(f.state === "GAMEOVER") {
                ctx.fillStyle = "rgba(255,0,0,0.8)"; ctx.fillRect(0,0,500,400);
                ctx.fillStyle = "#fff"; ctx.font = "28px Rajdhani"; ctx.fillText("AERONAVE ABATIDA", 140, 170);
                ctx.font = "18px Rajdhani"; ctx.fillText("Pressione a tecla 'R' para reiniciar", 135, 210);
                return; 
            }

            f.frame++;
            if(keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) {
                f.v = f.lift;
            } else {
                f.v += f.gravity;
                if(f.v > 3.5) f.v = 3.5;
            }
            f.y += f.v;

            if(f.frame % 100 === 0) {
                let gap = 150; let topH = Math.random() * (400 - gap - 60) + 20;
                f.pipes.push({x: 500, w: 55, top: topH, bottom: topH + gap, passed: false});
            }

            ctx.fillStyle = "#ff3b3b";
            for(let i = f.pipes.length - 1; i >= 0; i--) {
                let p = f.pipes[i]; p.x -= 2.8;
                ctx.fillRect(p.x, 0, p.w, p.top);
                ctx.fillRect(p.x, p.bottom, p.w, 400 - p.bottom);

                if(f.y < 0 || f.y + 20 > 400 || (50 + 30 > p.x && 50 < p.x + p.w && (f.y < p.top || f.y + 20 > p.bottom))) {
                    f.state = "GAMEOVER";
                }

                if(p.x + p.w < 50 && !p.passed) { f.sc++; p.passed = true; }
                if(p.x < -60) f.pipes.splice(i, 1);
            }

            ctx.fillStyle = "#00ff00"; ctx.fillRect(50, f.y, 35, 20); 
            ctx.fillStyle = "#fff"; ctx.fillRect(60, f.y+4, 10, 8); 
            
            ctx.fillStyle = "#aaa";
            if(f.frame % 4 < 2) ctx.fillRect(40, f.y-5, 55, 3);
            else ctx.fillRect(55, f.y-5, 25, 3);
            ctx.fillRect(65, f.y-5, 4, 5); 

            document.getElementById('scoreBoard').innerText = `Zonas Seguras: ${f.sc}`;
        }

        // ==========================================
        //  ❌ JOGO DA VELHA
        // ==========================================
        let velha = {};
        function menuVelha() {
            activeGame = "VELHA_MENU";
            cancelAnimationFrame(animFrame);
            canvas.onclick = null;
            
            ctx.fillStyle = "#0a0a0a"; ctx.fillRect(0,0,500,400);
            ctx.fillStyle = "#ff3b3b"; ctx.font = "bold 22px Rajdhani"; ctx.fillText("SELECIONE O NÍVEL DE INTELIGÊNCIA:", 95, 80);
            
            document.getElementById('gameInstructions').innerText = "Escolha a dificuldade da IA para iniciar a partida.";
            document.getElementById('scoreBoard').innerText = "Configuração do Jogo da Velha";

            ctx.fillStyle = "#1b5e20"; ctx.fillRect(125, 120, 250, 50);
            ctx.fillStyle = "#fff"; ctx.font = "20px Rajdhani"; ctx.fillText("1. FÁCIL (Iniciante)", 175, 152);

            ctx.fillStyle = "#e65100"; ctx.fillRect(125, 195, 250, 50);
            ctx.fillStyle = "#fff"; ctx.fillText("2. MÉDIO (Estratégico)", 170, 227);

            ctx.fillStyle = "#b71c1c"; ctx.fillRect(125, 270, 250, 50);
            ctx.fillStyle = "#fff"; ctx.fillText("3. IMPOSSÍVEL (Imbatível)", 160, 302);

            canvas.onclick = function(e) {
                let rect = canvas.getBoundingClientRect();
                let x = e.clientX - rect.left; let y = e.clientY - rect.top;
                if(x > 125 && x < 375) {
                    if(y > 120 && y < 170) iniciarVelha("facil");
                    if(y > 195 && y < 245) iniciarVelha("medio");
                    if(y > 270 && y < 320) iniciarVelha("impossivel");
                }
            };
        }

        function iniciarVelha(dificuldade) {
            activeGame = "VELHA";
            canvas.onclick = null;
            velha = { board: ["","","","","","","","",""], turn: "X", diff: dificuldade, winner: null };
            document.getElementById('gameInstructions').innerText = `Você [ X ] contra IA (${dificuldade.toUpperCase()}) [ O ].`;
            document.getElementById('scoreBoard').innerText = "Sua vez de jogar!";
            
            desenharVelha();
            canvas.onclick = cliqueVelha;
        }

        function desenharVelha() {
            ctx.fillStyle = "#0a0a0a"; ctx.fillRect(0,0,500,400);
            
            ctx.strokeStyle = "#ff3b3b"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(200, 60); ctx.lineTo(200, 340); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(300, 60); ctx.lineTo(300, 340); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(110, 150); ctx.lineTo(390, 150); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(110, 250); ctx.lineTo(390, 250); ctx.stroke();

            for(let i=0; i<9; i++) {
                let col = i % 3; let row = Math.floor(i / 3);
                let x = 110 + col * 95 + 47; let y = 60 + row * 95 + 47;
                if(velha.board[i] === "X") {
                    ctx.fillStyle = "#00b0ff"; ctx.font = "bold 45px Rajdhani"; ctx.fillText("X", x-12, y+15);
                } else if(velha.board[i] === "O") {
                    ctx.fillStyle = "#ff3b3b"; ctx.font = "bold 45px Rajdhani"; ctx.fillText("O", x-15, y+15);
                }
            }

            if(velha.winner) {
                ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0,0,500,400);
                ctx.fillStyle = "#fff"; ctx.font = "bold 28px Rajdhani";
                let msg = velha.winner === "Empate" ? "EMPATE TÁTICO!" : `VENCEDOR: ${velha.winner}!`;
                ctx.fillText(msg, 160, 180);
                ctx.font = "16px Rajdhani"; ctx.fillText("Voltando ao menu de dificuldades...", 130, 220);
                
                canvas.onclick = null;
                setTimeout(() => {
                    if(activeGame === "VELHA") menuVelha();
                }, 1500);
            }
        }

        function checkWinner(b) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let w of wins) {
                if(b[w[0]] && b[w[0]] === b[w[1]] && b[w[0]] === b[w[2]]) return b[w[0]];
            }
            if(b.every(cell => cell !== "")) return "Empate";
            return null;
        }

        function cliqueVelha(e) {
            if(velha.winner || velha.turn !== "X") return;
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left; let y = e.clientY - rect.top;
            
            let col = Math.floor((x - 110) / 95);
            let row = Math.floor((y - 60) / 95);
            if(col >= 0 && col < 3 && row >= 0 && row < 3) {
                let idx = row * 3 + col;
                if(velha.board[idx] === "") {
                    velha.board[idx] = "X";
                    velha.winner = checkWinner(velha.board);
                    desenharVelha();
                    if(!velha.winner) {
                        velha.turn = "O";
                        document.getElementById('scoreBoard').innerText = "IA pensando...";
                        setTimeout(jogadaIA, 350);
                    }
                }
            }
        }

        function jogadaIA() {
            if(velha.winner) return;
            let move;
            if(velha.diff === "facil") {
                let vazias = velha.board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
                move = vazias[Math.floor(Math.random() * vazias.length)];
            } else if(velha.diff === "medio") {
                move = Math.random() < 0.4 ? melhorJogadaMinimax(velha.board) : velha.board.map((v, i) => v === "" ? i : null).filter(v => v !== null)[0];
            } else {
                move = melhorJogadaMinimax(velha.board);
            }

            if(move !== undefined) {
                velha.board[move] = "O";
                velha.winner = checkWinner(velha.board);
            }
            velha.turn = "X";
            desenharVelha();
            if(!velha.winner) document.getElementById('scoreBoard').innerText = "Sua vez de jogar!";
        }

        function melhorJogadaMinimax(board) {
            let melhorScore = -Infinity; let movimento;
            for(let i=0; i<9; i++) {
                if(board[i] === "") {
                    board[i] = "O";
                    let score = minimax(board, 0, false);
                    board[i] = "";
                    if(score > melhorScore) { melhorScore = score; movimento = i; }
                }
            }
            return movimento;
        }

        function minimax(board, depth, isMaximizing) {
            let res = checkWinner(board);
            if(res === "O") return 10 - depth;
            if(res === "X") return depth - 10;
            if(res === "Empate") return 0;

            if(isMaximizing) {
                let maxEval = -Infinity;
                for(let i=0; i<9; i++) {
                    if(board[i] === "") {
                        board[i] = "O";
                        let eval = minimax(board, depth + 1, false);
                        board[i] = "";
                        maxEval = Math.max(maxEval, eval);
                    }
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for(let i=0; i<9; i++) {
                    if(board[i] === "") {
                        board[i] = "X";
                        let eval = minimax(board, depth + 1, true);
                        board[i] = "";
                        minEval = Math.min(minEval, eval);
                    }
                }
                return minEval;
            }
        }

        // ==========================================
        //  ♟️ JOGO DE DAMA (COM CAPTURA)
        // ==========================================
        let dama = {};
        function iniciarDama() {
            activeGame = "DAMA";
            cancelAnimationFrame(animFrame);
            
            document.getElementById('gameInstructions').innerText = "Clique na sua peça vermelha, depois em uma casa vazia ou pule a peça azul.";
            document.getElementById('scoreBoard').innerText = "Sua vez (Vermelhas)";
            
            let b = [];
            for(let r=0; r<8; r++) {
                b[r] = [];
                for(let c=0; c<8; c++) {
                    if((r + c) % 2 === 1) {
                        if(r < 3) b[r][c] = "C"; 
                        else if(r > 4) b[r][c] = "P"; 
                        else b[r][c] = "";
                    } else b[r][c] = "";
                }
            }
            dama = { board: b, selected: null, turn: "P" };
            
            canvas.onclick = function(e) {
                if(activeGame !== "DAMA" || dama.turn !== "P") return;
                
                let rect = canvas.getBoundingClientRect();
                let size = 44; 
                let ox = (500 - (size * 8)) / 2; 
                let oy = (400 - (size * 8)) / 2;
                
                let x = e.offsetX - ox; 
                let y = e.offsetY - oy;
                let c = Math.floor(x / size); 
                let r = Math.floor(y / size);

                if(c >= 0 && c < 8 && r >= 0 && r < 8) {
                    if(dama.board[r][c] === "P") {
                        dama.selected = {r, c};
                    } else if(dama.selected && dama.board[r][c] === "") {
                        let dr = r - dama.selected.r; 
                        let dc = c - dama.selected.c;
                        
                        if(Math.abs(dr) === 1 && Math.abs(dc) === 1) {
                            dama.board[r][c] = "P";
                            dama.board[dama.selected.r][dama.selected.c] = "";
                            finalizarTurnoPlayer();
                        }
                        else if(Math.abs(dr) === 2 && Math.abs(dc) === 2) {
                            let midR = dama.selected.r + dr / 2;
                            let midC = dama.selected.c + dc / 2;
                            if(dama.board[midR][midC] === "C") {
                                dama.board[r][c] = "P";
                                dama.board[dama.selected.r][dama.selected.c] = "";
                                dama.board[midR][midC] = "";
                                finalizarTurnoPlayer();
                            }
                        }
                    }
                }
            };

            loopDama();
            animFrame = requestAnimationFrame(gameLoop);
        }

        function finalizarTurnoPlayer() {
            dama.selected = null;
            let temPecasC = false;
            for(let r=0; r<8; r++) for(let c=0; c<8; c++) if(dama.board[r][c] === "C") temPecasC = true;
            
            if(!temPecasC) {
                document.getElementById('scoreBoard').innerText = "VITÓRIA TÁTICA! Forças inimigas eliminadas.";
                activeGame = "";
                return;
            }

            dama.turn = "C";
            document.getElementById('scoreBoard').innerText = "IA pensando...";
            setTimeout(turnoIAcadama, 600);
        }

        function loopDama() {
            if(activeGame !== "DAMA") return;
            ctx.fillStyle = "#0a0a0a"; ctx.fillRect(0,0,500,400);
            
            let size = 44; let ox = (500 - (size * 8)) / 2; let oy = (400 - (size * 8)) / 2;
            
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    let x = ox + c * size; let y = oy + r * size;
                    ctx.fillStyle = (r + c) % 2 === 1 ? "#2b2b2b" : "#e0e0e0";
                    ctx.fillRect(x, y, size, size);

                    if(dama.selected && dama.selected.r === r && dama.selected.c === c) {
                        ctx.strokeStyle = "#00ff00"; ctx.lineWidth = 4; ctx.strokeRect(x, y, size, size);
                    }

                    let p = dama.board[r][c];
                    if(p === "P") {
                        ctx.fillStyle = "#ff3b3b"; ctx.beginPath(); ctx.arc(x + size/2, y + size/2, size/3, 0, Math.PI*2); ctx.fill();
                        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
                    } else if(p === "C") {
                        ctx.fillStyle = "#00b0ff"; ctx.beginPath(); ctx.arc(x + size/2, y + size/2, size/3, 0, Math.PI*2); ctx.fill();
                        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
                    }
                }
            }
        }

        function turnoIAcadama() {
            if(activeGame !== "DAMA") return;
            let jumpMoves = [];
            let normalMoves = [];

            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    if(dama.board[r][c] === "C") {
                        let targets = [{r: r+2, c: c-2, midR: r+1, midC: c-1}, {r: r+2, c: c+2, midR: r+1, midC: c+1}, {r: r-2, c: c-2, midR: r-1, midC: c-1}, {r: r-2, c: c+2, midR: r-1, midC: c+1}];
                        for(let t of targets) {
                            if(t.r >= 0 && t.r < 8 && t.c >= 0 && t.c < 8) {
                                if(dama.board[t.r][t.c] === "" && dama.board[t.midR][t.midC] === "P") {
                                    jumpMoves.push({fr: r, fc: c, tr: t.r, tc: t.c, midR: t.midR, midC: t.midC});
                                }
                            }
                        }
                        if(r+1 < 8 && c-1 >= 0 && dama.board[r+1][c-1] === "") normalMoves.push({fr: r, fc: c, tr: r+1, tc: c-1});
                        if(r+1 < 8 && c+1 < 8 && dama.board[r+1][c+1] === "") normalMoves.push({fr: r, fc: c, tr: r+1, tc: c+1});
                    }
                }
            }

            if(jumpMoves.length > 0) {
                let m = jumpMoves[Math.floor(Math.random() * jumpMoves.length)];
                dama.board[m.tr][m.tc] = "C";
                dama.board[m.fr][m.fc] = "";
                dama.board[m.midR][m.midC] = "";
            } else if(normalMoves.length > 0) {
                let m = normalMoves[Math.floor(Math.random() * normalMoves.length)];
                dama.board[m.tr][m.tc] = "C";
                dama.board[m.fr][m.fc] = "";
            }

            let temPecasP = false;
            for(let r=0; r<8; r++) for(let c=0; c<8; c++) if(dama.board[r][c] === "P") temPecasP = true;
            
            if(!temPecasP) {
                document.getElementById('scoreBoard').innerText = "DERROTA TÁTICA! Todas as unidades abatidas.";
                activeGame = "";
                return;
            }

            dama.turn = "P";
            document.getElementById('scoreBoard').innerText = "Sua vez (Vermelhas)";
        }
    </script>
